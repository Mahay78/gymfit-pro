<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#10b981" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="GymFit Pro - App de entrenamiento de fuerza y pérdida de grasa con rutinas, seguimiento de peso, medidas y records personales." />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <title>GymFit Pro — Burn & Tone</title>
    <style>
      body { margin: 0; padding: 0; background-color: #020617; font-family: 'Inter', sans-serif; }
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #020617; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
      }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #1e293b;
        border-top-color: #10b981; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .fade-out { opacity: 0; transition: opacity 0.5s ease-out; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="spinner"></div>
      <h1 style="color: #10b981; font-weight: 900; margin-top: 20px; font-size: 1.5rem;">GymFit Pro</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
