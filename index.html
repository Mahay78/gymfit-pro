<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="alternate icon" type="image/png" href="%BASE_URL%pwa-192x192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192x192.png" />
    <link rel="mask-icon" href="%BASE_URL%mask-icon.svg" color="#10b981" />
    <meta name="description" content="GymFit Pro - App de entrenamiento de fuerza y pérdida de grasa con rutinas, seguimiento de peso, medidas y records personales." />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <title>GymFit Pro — Burn & Tone</title>
    <style>
      body { margin: 0; padding: 0; background-color: #010409; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #010409; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; z-index: 9999;
      }
      .brand-mark {
        width: 64px; height: 64px; border-radius: 18px; color: #022c22;
        background: linear-gradient(135deg, #34d399, #2dd4bf);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 32px -8px rgba(16, 185, 129, 0.6);
      }
      .brand-mark svg { width: 32px; height: 32px; }
      #splash-screen h1 {
        margin: 0; color: #f1f5f9; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.02em;
      }
      .spinner {
        width: 28px; height: 28px; border: 3px solid #1e293b;
        border-top-color: #10b981; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .fade-out { opacity: 0; transition: opacity 0.5s ease-out; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h1>GymFit Pro</h1>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 500);
          }
        }, 300);
      });
    </script>
  </body>
</html>
